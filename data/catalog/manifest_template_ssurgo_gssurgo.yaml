# ── Known limitations ────────────────────────────────────────────────────────
known_limitations: >-
  Remote western survey gaps; map-unit attributes are representative of the
  survey unit, not point observations. EC/salinity attributes may be sparse in
  the Walker Lake playa margins. Treat as a competing-explanation confounder,
  not a direct salinity measurement.

