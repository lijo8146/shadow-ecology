# The only authoritative analysis extent for confirmatory processing.
# Boundary status updated 2026-10-01: geometry method frozen; NHDPlus HR/WBD
# extraction and final vector file pending download. See data/catalog/aoi_decision_note.md.
study_area:
  id: lower_walker_terminal_basin
  name: "Lower Walker River–Walker Lake terminal-basin cluster, Nevada"
  decision_date: "2026-09-24"
  boundary_frozen_date: "2026-10-01"
  aoi_decision_note: "data/catalog/aoi_decision_note.md"
  aoi_vector_file: "data/catalog/aoi_final.geojson"   # written after NHDPlus download
  aoi_geometry_status: "method_frozen_extraction_pending"
  crs_analysis: "EPSG:32611"  # UTM zone 11N
  crs_source: "EPSG:4326"
  provisional_bbox_wgs84: [-119.20, 38.50, -118.55, 39.22]
  aoi_buffer_km: 2
  # Primary imagery and reference-label years are frozen before any download.
  # Selection rationale: 2023 is the most recent calendar year with a complete
  # Sentinel-2 archive and a matching NLCD annual product (NLCD 2021 Products
  # v2.0 includes annual series through 2023).  Three usable seasons
  # (spring Apr–May, peak Jul–Aug, late Sep–Oct) are available.
  imagery_target_year: 2023
  reference_label_year: 2021   # NLCD 2021 Land Cover L48 — most recent year
                                # available as a WCS coverage on the MRLC GeoServer.
                                # NLCD Annual Collection 1.0 per-year rasters for
                                # 2022–2023 are not yet served via WCS (only summary
                                # change products). Update when MRLC publishes them.
  imagery_year_decision_date: "2026-10-01"
  imagery_year_rationale: >-
    Imagery target year 2023: most recent complete calendar year at decision
    date, full three-season Sentinel-2 L2A archive available.
    Reference label year 2021: NLCD_2021_Land_Cover_L48 is the most recent
    traditional per-year land cover product available via the MRLC WCS
    GetCoverage endpoint. NLCD Annual Collection 1.0 per-year rasters for
    2022–2023 are not yet served as WCS coverages. The 2-year gap between
    imagery (2023) and labels (2021) is documented; label-year alignment will
    be revisited if MRLC publishes 2022/2023 per-year products before modeling.
    Year locked before imagery download per data_inventory.md §Acquisition checks.
  hydrologic_scope: >-
    Lower Walker River from the USGS Wabuska gage through Weber Reservoir and
    the Walker River Paiute Reservation to Walker Lake, plus valley-floor and
    adjacent landform contexts required for comparison.
  upstream_anchor:
    name: "USGS 10301500 Walker River near Wabuska"
    longitude: -119.0988889
    latitude: 39.1524611
  downstream_anchor:
    name: "Walker Lake near Hawthorne"
    longitude: -118.7720849
    latitude: 38.6765864
  boundary_workflow:
    source: "NHDPlus HR/WBD HUC-8 16050302 plus 2 km valley-floor buffer"
    required_before_download: true
  governance_notice: >-
    Follow governance_boundary_register.md before interpreting or releasing
    place-specific results on or adjacent to Tribal lands or waters.
